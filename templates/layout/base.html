<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Base{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="d-flex min-vh-100 bg-light">
    <!-- Sidebar -->
    <aside
      class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end position-sticky top-0 vh-100"
      style="width: 260px;"
    >
      <!-- Header / Logo -->
      <a
        href="/"
        class="d-flex align-items-center gap-3 text-decoration-none px-2 mb-3 link-body-emphasis"
      >
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBVuKWUX_hY_q0gbnu_KbjphG0g1fVGU87pi8KjVgnZq2cZeyNScXvm00R&s=10"
          alt="ETEC Logo"
          width="40"
          height="40"
          class="rounded-circle border"
        />
        <div class="lh-1">
          <span class="fw-bold fs-6 d-block">ETEC STOCK</span>
          <small class="text-body-secondary fs-7">Management</small>
        </div>
      </a>

      <hr class="my-2 text-secondary opacity-25" />

      <!-- Navigation Menu -->
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="#" class="nav-link active d-flex align-items-center gap-2" aria-current="page">
            <i class="bi bi-house-door fs-5"></i>
            Home
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
            <i class="bi bi-speedometer2 fs-5 text-secondary"></i>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
            <i class="bi bi-table fs-5 text-secondary"></i>
            Category
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
            <i class="bi bi-box-seam fs-5 text-secondary"></i>
            Products
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
            <i class="bi bi-people fs-5 text-secondary"></i>
            Customers
          </a>
        </li>
      </ul>

      <hr class="my-2 text-secondary opacity-25" />

      <!-- User Dropdown Footer -->
      <div class="dropdown">
        <a
          href="#"
          class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle p-2 rounded link-body-emphasis"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img
            src="https://github.com/mdo.png"
            alt="User avatar"
            width="32"
            height="32"
            class="rounded-circle"
          />
          <strong class="small">mdo</strong>
        </a>
        <ul class="dropdown-menu text-small shadow border-0 mt-2">
          <li><a class="dropdown-item d-flex align-items-center gap-2" href="#"><i class="bi bi-plus-circle"></i>New project...</a></li>
          <li><a class="dropdown-item d-flex align-items-center gap-2" href="#"><i class="bi bi-gear"></i>Settings</a></li>
          <li><a class="dropdown-item d-flex align-items-center gap-2" href="#"><i class="bi bi-person"></i>Profile</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item text-danger d-flex align-items-center gap-2" href="#"><i class="bi bi-box-arrow-right"></i>Sign out</a></li>
        </ul>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="flex-grow-1 p-4">
      <div class="container-fluid p-0">
        {% block content %}
          <!-- Main content follows project features -->
        {% endblock %}
      </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
