{% extends 'layout/base.html' %}
{% block title %}Prodcut List{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <!-- Page Header & Action Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1">Product List</h1>
            <p class="text-body-secondary small mb-0">Manage products</p>
        </div>
        <a href="{{url_for('create_product')}}" class="btn btn-primary d-inline-flex align-items-center gap-2 shadow-sm fw-medium">
            <i class="bi bi-plus-lg"></i>
            Add New Product
        </a>
    </div>

    <!-- Data Table Container Card -->
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light border-bottom">
                        <tr class="text-uppercase text-body-secondary fs-7 fw-semibold">
                            <th scope="col" class="py-3 px-4" style="width: 80px;">#</th>
                            <th scope="col" class="py-3 px-4">Name</th>
                            <th scope="col" class="py-3 px-4">Category</th>
                            <th scope="col" class="py-3 px-4">Price</th>
                            <th scope="col" class="py-3 px-4">Quantity</th>
                            <th scope="col" class="py-3 px-4">Iamge</th>
                            <th scope="col" class="py-3 px-4 text-end" style="width: 140px;">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">

            <nav aria-label="Table navigation">
                <ul class="pagination pagination-sm mb-0">
